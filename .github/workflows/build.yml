name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spkl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build test plugins
        run: |
          dotnet build TestPlugin
          dotnet build TestWorkflowActivity
          dotnet build TestPluginWorkflowCombined
      - name: Build CLI
        run: dotnet build spkl -c Release
      - name: Unit tests
        run: dotnet test SparkleXrm.Tasks.Tests --filter "TestCategory=Unit Tests"
      - name: Pack
        run: ..\build\Pack.ps1 -OutputDirectory "$env:RUNNER_TEMP\packages"
      - name: Build a solution created from the template
        working-directory: ${{ runner.temp }}
        run: |
          dotnet new install "$env:RUNNER_TEMP\packages\Spkl.OnPrem.Templates.1.0.0.nupkg"
          dotnet new spkl-solution -n Fabrikam -o Fabrikam --SolutionUniqueName ContosoCore --allow-scripts no
          cd Fabrikam
          pwsh -NoProfile -File Tooling\New-SigningKey.ps1
          if (Select-String -Path Tooling\spkl.json -Pattern '<SolutionUniqueName>' -SimpleMatch) { throw 'SolutionUniqueName was not replaced' }
          dotnet new nugetconfig
          dotnet nuget add source "$env:RUNNER_TEMP\packages" --name local --configfile nuget.config
          dotnet build Fabrikam.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE '.nuget\packages' }
          $spkl = Get-ChildItem (Join-Path $packages 'spkl.onprem') -Recurse -Filter spkl.exe | Select-Object -First 1
          if (-not $spkl) { throw 'spkl.exe was not restored by the Tooling project' }
          if (-not (Test-Path (Join-Path $spkl.DirectoryName 'spkl.CrmSvcUtilExtensions.dll'))) { throw 'spkl.CrmSvcUtilExtensions.dll is missing next to spkl.exe' }
          foreach ($assembly in 'Plugins\bin\Debug\Fabrikam.Plugins.dll', 'Actions\bin\Debug\Fabrikam.Actions.dll', 'Workflows\bin\Debug\Fabrikam.Workflows.dll') {
            $token = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $assembly)).GetPublicKeyToken()
            if (-not $token -or $token.Length -eq 0) { throw "$assembly is not strong-named" }
            if (-not [System.Reflection.Assembly]::LoadFile((Resolve-Path $assembly).Path).GetType('CrmPluginRegistrationAttribute')) { throw "$assembly does not contain CrmPluginRegistrationAttribute" }
          }
