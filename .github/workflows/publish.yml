name: publish

# Packs Spkl.OnPrem, Spkl.OnPrem.Attributes and Spkl.OnPrem.Templates and pushes them to the private feed.
# Run it by pushing a tag v<Version> (Version from Directory.Build.props) or manually.
# Repository secrets:
#   SPKL_FEED_URL       NuGet v3 index URL of the feed
#   SPKL_FEED_API_KEY   API key, or a personal access token when SPKL_FEED_USERNAME is set
#   SPKL_FEED_USERNAME  optional; feeds that need credentials to push (e.g. Azure Artifacts)
# Without SPKL_FEED_URL the packages are only uploaded as a workflow artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check tag matches Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Version $version in Directory.Build.props" }
      - name: Pack
        run: build\Pack.ps1 -OutputDirectory "$env:RUNNER_TEMP\packages"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.nupkg
      - name: Push
        env:
          SPKL_FEED_URL: ${{ secrets.SPKL_FEED_URL }}
          SPKL_FEED_API_KEY: ${{ secrets.SPKL_FEED_API_KEY }}
          SPKL_FEED_USERNAME: ${{ secrets.SPKL_FEED_USERNAME }}
        run: |
          if (-not $env:SPKL_FEED_URL) {
            Write-Host 'SPKL_FEED_URL is not set; packages were only uploaded as an artifact.'
            exit 0
          }
          $source = $env:SPKL_FEED_URL
          if ($env:SPKL_FEED_USERNAME) {
            dotnet nuget add source $env:SPKL_FEED_URL --name spkl-feed --username $env:SPKL_FEED_USERNAME --password $env:SPKL_FEED_API_KEY --store-password-in-clear-text
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $source = 'spkl-feed'
          }
          foreach ($package in Get-ChildItem "$env:RUNNER_TEMP\packages" -Filter *.nupkg) {
            dotnet nuget push $package.FullName --source $source --api-key $env:SPKL_FEED_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
